name: Illusive Networks
description: 'Illusive Networks was a cybersecurity company specializing in deception
  technology and identity threat detection and response (ITDR) — discovering and remediating
  identity vulnerabilities and detecting attacker lateral movement across on-premises
  and cloud environments using deceptive traps and agentless deception tactics. Backed
  by Bessemer Venture Partners, Innovation Endeavors, TPG and others, the company was
  acquired by Proofpoint in December 2022. Its technology now ships as Proofpoint Identity
  Threat Defense (previously Illusive); the standalone illusive.com property redirects
  to Proofpoint and the company no longer operates an independent developer, API, or
  documentation surface.'
